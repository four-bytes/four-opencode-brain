name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test
